name: Backtest API container

on:
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "compose.yaml"
      - "Caddyfile"
      - "packages/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/backtest-api-container.yml"
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "compose.yaml"
      - "Caddyfile"
      - "packages/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/backtest-api-container.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: macro-regime-quant-backtest-api:ci
          provenance: false
