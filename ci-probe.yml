name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Resolve lockfile
        # Fail loudly if a package was added without updating uv.lock.
        run: uv lock --check

      - name: Sync workspace
        run: uv sync --all-packages --frozen

      - name: Lint
        run: uv run ruff check packages tests

      - name: Test
        run: uv run pytest -q

      - name: Verify layering
        run: uv run python scripts/check_layering.py
