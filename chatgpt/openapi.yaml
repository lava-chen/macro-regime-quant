openapi: 3.1.0
info:
  title: Macro Regime Quant Backtest
  version: 1.0.0
  description: Save long-only target-weight strategies and run reproducible portfolio backtests.
servers:
  - url: https://YOUR-BACKTEST-HOST.example
security:
  - BearerAuth: []
paths:
  /assets:
    get:
      operationId: listAssets
      summary: List configured market assets
      responses:
        '200':
          description: Configured Yahoo and local CSV market symbols
          content:
            application/json:
              schema:
                type: object
                properties:
                  assets:
                    type: array
                    items:
                      type: object
                      properties:
                        symbol: { type: string }
                        kind: { type: string }
                        provider: { type: string }
  /strategies:
    get:
      operationId: listStrategies
      summary: List saved strategies
      responses:
        '200':
          description: Saved strategy definitions
          content:
            application/json:
              schema:
                type: object
                properties:
                  strategies:
                    type: array
                    items: { type: object }
    post:
      operationId: saveStrategy
      summary: Save a named strategy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Strategy'
      responses:
        '201':
          description: Saved strategy record
          content:
            application/json:
              schema: { type: object }
        '409': { description: Strategy name already exists }
  /strategies/{strategy_id}:
    put:
      operationId: updateStrategy
      summary: Update an existing named strategy
      parameters:
        - name: strategy_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Strategy'
      responses:
        '200':
          description: Updated strategy record with incremented version
          content:
            application/json:
              schema: { type: object }
        '404': { description: Strategy not found }
  /strategies/{strategy_id}/versions:
    get:
      operationId: listStrategyVersions
      summary: List immutable saved versions of a strategy
      parameters:
        - name: strategy_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Strategy versions in ascending version order
          content:
            application/json:
              schema:
                type: object
                properties:
                  versions:
                    type: array
                    items: { type: object }
        '404': { description: Strategy not found }
  /strategies/{strategy_id}/versions/{version}:
    get:
      operationId: getStrategyVersion
      summary: Retrieve an immutable strategy version
      parameters:
        - name: strategy_id
          in: path
          required: true
          schema: { type: string }
        - name: version
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Immutable strategy definition for the requested version
          content:
            application/json:
              schema: { type: object }
        '404': { description: Strategy version not found }
  /backtests:
    post:
      operationId: runBacktest
      summary: Run a backtest for an inline or saved strategy
      description: Returns performance metrics, benchmarks, drawdown, monthly returns, and input provenance.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              oneOf:
                - required: [strategy]
                  properties:
                    strategy: { $ref: '#/components/schemas/Strategy' }
                - required: [strategy_id]
                  properties:
                    strategy_id: { type: string }
                    version: { type: integer, minimum: 1, description: Saved strategy version; defaults to latest. }
      responses:
        '200':
          description: Detailed backtest report
          content:
            application/json:
              schema: { type: object }
        '422': { description: Invalid strategy or data request }
  /backtest-runs:
    post:
      operationId: submitBacktest
      summary: Submit a backtest and receive its run ID
      description: The durable single-process worker starts the run asynchronously. Poll the status endpoint, then retrieve the saved report.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, minLength: 1, maxLength: 128 }
          description: Reusing the same key and request returns the original run; using the key for a different request returns 422.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              oneOf:
                - required: [strategy]
                  properties:
                    strategy: { $ref: '#/components/schemas/Strategy' }
                - required: [strategy_id]
                  properties:
                    strategy_id: { type: string }
                    version: { type: integer, minimum: 1 }
      responses:
        '202':
          description: Accepted; includes run_id and current status
          content:
            application/json:
              schema:
                type: object
                required: [run_id, status]
                properties:
                  run_id: { type: string }
                  status: { type: string, enum: [queued, running, succeeded, failed] }
                  submitted_at: { type: string, format: date-time }
                  started_at: { type: [string, 'null'], format: date-time }
                  finished_at: { type: [string, 'null'], format: date-time }
                  backtest_id: { type: [string, 'null'] }
                  error: { type: [string, 'null'] }
                  attempts: { type: integer }
        '422': { description: Invalid strategy, data request, or idempotency conflict }
  /backtest-runs/{run_id}:
    get:
      operationId: getBacktestStatus
      summary: Read asynchronous backtest status
      parameters:
        - name: run_id
          in: path
          required: true
          schema: { type: string, pattern: '^bt_[a-f0-9]{24}$' }
      responses:
        '200':
          description: Queued, running, succeeded, or failed status
          content:
            application/json:
              schema: { type: object }
        '404': { description: Run was not found }
  /data-status:
    get:
      operationId: getDataStatus
      summary: Inspect available price snapshots and provider configuration
      description: Provider configuration does not imply fetched coverage; local snapshots are schema-checked without filling missing values.
      responses:
        '200':
          description: Coverage, retrieval metadata, checksum, and quality state per configured asset
          content:
            application/json:
              schema: { type: object }
  /backtests/{run_id}:
    get:
      operationId: getBacktest
      summary: Retrieve a saved backtest report
      parameters:
        - name: run_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Saved backtest report
          content:
            application/json:
              schema: { type: object }
        '404': { description: Backtest report not found }
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API token
  schemas:
    Strategy:
      type: object
      required: [name, weights]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        weights:
          type: object
          description: Long-only weights keyed by configured market symbol; values must sum to 1. CASH is supported.
          additionalProperties: { type: number, minimum: 0 }
        rebalance_frequency:
          type: string
          enum: [buy_and_hold, monthly, quarterly, annual]
          default: monthly
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        initial_capital: { type: number, exclusiveMinimum: 0, default: 10000 }
        transaction_cost_bps: { type: number, minimum: 0, default: 5 }
        cash_flow:
          type: object
          description: Optional scheduled deposits and portfolio-level profit-taking/drawdown rules.
          required: [weekly_contribution_amount]
          properties:
            weekly_contribution_amount:
              type: number
              exclusiveMinimum: 0
              description: Amount in the strategy currency contributed once per week.
            contribution_day:
              type: string
              enum: [MON, TUE, WED, THU, FRI]
              default: FRI
              description: Use the last available market close in each week ending on this weekday.
            reinvest_cash:
              type: boolean
              default: false
              description: Redeploy earlier idle cash on the next weekly contribution date, subject to the active drawdown exposure cap.
            take_profit_tiers:
              type: array
              description: One-time triggers on cumulative time-weighted return; sell fractions of then-current risk holdings at the next available close.
              items:
                type: object
                required: [return_threshold, sell_fraction]
                properties:
                  return_threshold: { type: number, exclusiveMinimum: 0, description: Decimal return threshold; 0.20 means 20%. }
                  sell_fraction: { type: number, exclusiveMinimum: 0, maximum: 1, description: Fraction of current risk holdings to sell. }
            drawdown_rules:
              type: array
              description: Ordered peak-to-trough unitized-NAV triggers. Exposure is capped until unitized NAV makes a new high; this does not guarantee a maximum loss.
              items:
                type: object
                required: [trigger_drawdown, max_invested_weight]
                properties:
                  trigger_drawdown: { type: number, exclusiveMinimum: 0, exclusiveMaximum: 1, description: Decimal drawdown threshold; 0.15 means 15%. }
                  max_invested_weight: { type: number, minimum: 0, maximum: 1, description: Maximum account fraction in risky assets after the rule triggers. }
