[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "macro-regime-quant"
version = "0.1.0"
description = "Long-horizon China/US macro regime research and backtesting framework"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "pyyaml>=6.0",
]

[project.scripts]
macro-regime-quant = "macro_regime_quant.cli:main"

[project.optional-dependencies]
data = [
  "yfinance>=0.2.50",
  "requests>=2.32",
]
china = [
  "akshare>=1.17",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
