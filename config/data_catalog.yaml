# Research catalog. Release lags are conservative v1 approximations.
# For revised macro series, latest-vintage FRED history is NOT publication-quality
# point-in-time history; use ALFRED/official vintages before claiming historical alpha.
series:
  us_industrial_production:
    provider: fred
    symbol: INDPRO
    kind: macro
    frequency: monthly
    release_lag_days: 18
    notes: "Industrial Production Index; approximate mid-month release lag."

  us_real_retail_sales:
    provider: fred
    symbol: RRSFS
    kind: macro
    frequency: monthly
    release_lag_days: 18
    notes: "Real Retail and Food Services Sales; latest-vintage baseline."

  us_payrolls:
    provider: fred
    symbol: PAYEMS
    kind: macro
    frequency: monthly
    release_lag_days: 7

  us_unemployment:
    provider: fred
    symbol: UNRATE
    kind: macro
    frequency: monthly
    release_lag_days: 7

  us_cfnai:
    provider: fred
    symbol: CFNAI
    kind: macro
    frequency: monthly
    release_lag_days: 25
    notes: "Chicago Fed National Activity Index; broad activity proxy."

  us_cpi:
    provider: fred
    symbol: CPIAUCSL
    kind: macro
    frequency: monthly
    release_lag_days: 14

  us_core_cpi:
    provider: fred
    symbol: CPILFESL
    kind: macro
    frequency: monthly
    release_lag_days: 14

  us_core_pce:
    provider: fred
    symbol: PCEPILFE
    kind: macro
    frequency: monthly
    release_lag_days: 30

  us_ppi_all_commodities:
    provider: fred
    symbol: PPIACO
    kind: macro
    frequency: monthly
    release_lag_days: 14

  us_10y:
    provider: fred
    symbol: DGS10
    kind: rate
    frequency: daily
    release_lag_days: 0

  us_10y_real:
    provider: fred
    symbol: DFII10
    kind: rate
    frequency: daily
    release_lag_days: 0

  us_m2:
    provider: fred
    symbol: M2SL
    kind: macro
    frequency: monthly
    release_lag_days: 28

  us_nfci:
    provider: fred
    symbol: NFCI
    kind: rate
    frequency: weekly
    release_lag_days: 7
    notes: "Chicago Fed NFCI. Higher = tighter financial conditions."

  us_high_yield_oas:
    provider: fred
    symbol: BAMLH0A0HYM2
    kind: rate
    frequency: daily
    release_lag_days: 0
    notes: "ICE BofA US High Yield Index option-adjusted spread."

  sp500_proxy:
    provider: yahoo
    symbol: SPY
    kind: market
    frequency: daily
    release_lag_days: 0

  nasdaq_proxy:
    provider: yahoo
    symbol: QQQ
    kind: market
    frequency: daily
    release_lag_days: 0

  gold_proxy:
    provider: yahoo
    symbol: GLD
    kind: commodity
    frequency: daily
    release_lag_days: 0

  cny_usd:
    provider: yahoo
    symbol: CNY=X
    kind: fx
    frequency: daily
    release_lag_days: 0

# China macro will enter through frozen official snapshots first.
# See docs/data_sources.md; canonical live adapters come after snapshot validation.
