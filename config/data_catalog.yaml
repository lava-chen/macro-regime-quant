# Research catalog.
#
# The FRED-backed entries point at `alfred`, not `fred`. That distinction is the
# whole point: FRED returns the latest revised history, so a backtest driven by
# it reads numbers that did not exist at the time. ALFRED can return the vintage
# that stood on a given date.
#
# Vintage support alone is still not enough — a single pull with today's vintage
# is still today's knowledge. The archive under data/vintages/ is what makes it
# true. Grow it with:
#
#   macro-regime-quant snapshot-vintages --series us_core_cpi --start 2000-01-01
#
# The archive supports explicit as-of reads, but build-us-baseline and test-idea
# do NOT yet load those archives per historical decision date. Their results
# remain research-only until that engine integration is implemented and tested.
# See docs/research_loop.md.
#
# release_lag_days remain conservative v1 estimates. They are the floor used when
# a series is read without an archive; the vintage clamp is what keeps the result
# from reaching past what was knowable.
