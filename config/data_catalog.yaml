# v0 catalog: examples and priorities, not a claim that every live provider is permanent.
series:
  us_real_gdp:
    provider: fred
    symbol: GDPC1
    kind: macro
    frequency: quarterly
    release_lag_days: 30
    notes: "US real GDP. Fixed lag is only a v0 approximation; use actual/vintage releases later."

  us_cpi:
    provider: fred
    symbol: CPIAUCSL
    kind: macro
    frequency: monthly
    release_lag_days: 14
    notes: "US CPI. Replace fixed lag with publication calendar in v1."

  us_core_cpi:
    provider: fred
    symbol: CPILFESL
    kind: macro
    frequency: monthly
    release_lag_days: 14

  us_10y:
    provider: fred
    symbol: DGS10
    kind: rate
    frequency: daily
    release_lag_days: 0

  us_10y_real:
    provider: fred
    symbol: DFII10
    kind: rate
    frequency: daily
    release_lag_days: 0

  sp500_proxy:
    provider: yahoo
    symbol: SPY
    kind: market
    frequency: daily
    release_lag_days: 0

  nasdaq_proxy:
    provider: yahoo
    symbol: QQQ
    kind: market
    frequency: daily
    release_lag_days: 0

  gold_proxy:
    provider: yahoo
    symbol: GLD
    kind: commodity
    frequency: daily
    release_lag_days: 0

  cny_usd:
    provider: yahoo
    symbol: CNY=X
    kind: fx
    frequency: daily
    release_lag_days: 0

# China macro should initially enter as frozen official snapshots in data/raw/.
# Preferred source hierarchy is documented in docs/data_sources.md.
