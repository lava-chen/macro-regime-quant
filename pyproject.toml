# Workspace root. Holds no source code — only the workspace declaration and the
# tooling that runs across every member. Layering is strictly one-way:
#
#     core  <-  data  <-  engines  <-  research  <-  cli
#
# mrq-core imports nothing from the other packages, so the point-in-time
# vocabulary cannot be changed by engine work.

[project]
name = "macro-regime-quant-workspace"
version = "0.1.0"
description = "Point-in-time-safe macro and equity research workspace"
requires-python = ">=3.11"
dependencies = []

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
mrq-core = { workspace = true }
mrq-data = { workspace = true }
mrq-engines = { workspace = true }
mrq-research = { workspace = true }
mrq-cli = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["packages"]
